<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="1120x650">
<link rel="stylesheet" href="_base.css">
<style>
.stage{height:650px;padding:60px 64px}
.title{font-size:54px;margin-top:12px}
.wrap{display:flex;gap:28px;margin-top:40px;align-items:flex-start}
.entry{flex:1;padding:34px 36px 36px}
.top{display:flex;gap:22px;align-items:center}
.conf{width:84px;height:84px;border-radius:50%;background:linear-gradient(145deg,#2A5A3C,#1B3828);display:grid;place-items:center;color:var(--gold);font-weight:800;font-size:28px;flex:none}
.cn{font-size:30px;font-weight:800;line-height:1.15}
.cs{font-size:22px;color:var(--muted);margin-top:4px}
.facts{display:flex;gap:40px;margin-top:28px;padding-top:24px;border-top:1px solid #EFE9DC}
.facts div{font-size:22px;color:var(--muted)}
.facts b{display:block;font-size:28px;color:var(--ink);font-weight:700;margin-top:4px}
.aw{display:flex;align-items:center;gap:18px;margin-top:26px;background:linear-gradient(90deg,rgba(238,217,138,.45),rgba(238,217,138,.12));border-radius:18px;padding:18px 22px}
.medal{width:62px;height:62px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#F8EDB8,#E3C25A 60%,#B6871F);display:grid;place-items:center;box-shadow:0 4px 10px rgba(182,135,31,.4);flex:none}
.aw b{font-size:34px;font-weight:800;color:var(--ink)}
.pick{width:330px;flex:none;padding:28px 28px 30px}
.pick h4{font-size:23px;font-weight:700;color:var(--forest);margin-bottom:14px}
.p{display:flex;align-items:center;gap:14px;padding:13px 0;font-size:25px;font-weight:600;border-bottom:1px solid #F1ECE0}
.p:last-child{border-bottom:0}
.bx{width:30px;height:30px;border-radius:8px;border:3px solid #C7BCA8;flex:none;display:grid;place-items:center}
.bx.on{background:var(--forest);border-color:var(--forest)}
</style></head><body>
<div class="stage">
  <div class="eyebrow">MUN CV</div>
  <div class="title">The dais counts <span class="accent">too</span></div>
  <div class="wrap">
    <div class="card entry">
      <div class="top"><div class="conf">NM</div><div><div class="cn">Northbridge MUN 2026</div><div class="cs">March 2026 · Lisbon</div></div></div>
      <div class="facts"><div>Position<b>Chair</b></div><div>Committee<b>UNHRC</b></div></div>
      <div class="aw"><div class="medal"><svg width="30" height="30" viewBox="0 0 24 24" fill="#7A5812"><path d="M12 2.5l2.9 5.9 6.5.9-4.7 4.6 1.1 6.5L12 17.3l-5.8 3.1 1.1-6.5L2.6 9.3l6.5-.9z"/></svg></div><b>Best Chair</b></div>
    </div>
    <div class="card pick">
      <h4>Chairing awards</h4>
      <div class="p"><span class="bx on"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></span>Best Chair</div>
      <div class="p"><span class="bx"></span>Best Dais</div>
      <div class="p"><span class="bx"></span>Outstanding Chair</div>
      <div class="p"><span class="bx"></span>Your own</div>
    </div>
  </div>
</div>
</body></html>
