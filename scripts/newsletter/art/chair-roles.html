<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="1120x690">
<link rel="stylesheet" href="_base.css">
<style>
.stage{height:690px;padding:60px 64px}
.title{font-size:54px;margin-top:12px}
.dais{margin-top:44px;padding:44px 40px 48px}
.cm{display:flex;align-items:baseline;gap:16px;padding-bottom:28px;border-bottom:1px solid #EFE9DC}
.cm b{font-size:36px;font-weight:800;color:var(--forest)}
.cm span{font-size:24px;color:var(--muted)}
.row{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin-top:36px;text-align:center}
.av{width:140px;height:140px;border-radius:50%;margin:0 auto;display:grid;place-items:center;font-size:48px;font-weight:700;box-shadow:0 2px 4px rgba(27,56,40,.10),0 10px 22px rgba(27,56,40,.14)}
.nm{font-size:29px;font-weight:700;margin-top:20px;line-height:1.2}
.tt{font-size:25px;font-weight:600;color:var(--deepgold);margin-top:6px}
</style></head><body>
<div class="stage">
  <img class="mark" src="../../../public/gavel-mark.png" style="width:400px;right:-50px;top:-60px">
  <div class="eyebrow">Conference page · Committees</div>
  <div class="title">Who leads the <span class="accent">room</span></div>
  <div class="card dais">
    <div class="cm"><b>UNHRC</b><span>Human Rights Council</span></div>
    <div class="row">
      <div><div class="av" style="background:linear-gradient(145deg,#2A5A3C,#1B3828);color:var(--gold)">PZ</div><div class="nm">Peter Zakhar</div><div class="tt">Chair</div></div>
      <div><div class="av" style="background:#F6EBC4;color:#7A5812">SM</div><div class="nm">Sofia Marin</div><div class="tt">Vice Chair</div></div>
      <div><div class="av" style="background:#DCE8DF;color:var(--forest)">JW</div><div class="nm">Jonas Weber</div><div class="tt">Rapporteur</div></div>
    </div>
  </div>
</div>
</body></html>
