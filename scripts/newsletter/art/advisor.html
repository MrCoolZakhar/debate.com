<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="1120x760">
<link rel="stylesheet" href="_base.css">
<style>
.stage{height:760px;padding:56px 72px}
.head{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:30px}
.head .title{font-size:50px}
.seg{display:flex;background:#E2DBC9;border-radius:14px;padding:5px;box-shadow:inset 0 1px 2px rgba(27,56,40,.12)}
.seg span{padding:12px 22px;font-size:22px;font-weight:600;color:var(--inksoft);border-radius:10px}
.seg span.on{background:#fff;color:var(--forest);box-shadow:0 2px 6px rgba(27,56,40,.14)}
.list{padding:10px 0}
.row{display:flex;align-items:center;gap:24px;padding:22px 34px;border-bottom:1px solid #EFE9DC}
.row:last-child{border-bottom:0}
.place{width:52px;height:52px;border-radius:50%;flex:none;display:grid;place-items:center;font-size:24px;font-weight:700;color:var(--forest);background:#EEF2EC}
.place.now{background:var(--gold);box-shadow:0 2px 8px rgba(182,135,31,.35)}
.who{flex:1;min-width:0}
.name{font-size:30px;font-weight:700;color:var(--ink);line-height:1.15}
.sub{font-size:23px;color:var(--muted);margin-top:4px}
.sub b{color:var(--forest);font-weight:700}
.when{text-align:right;flex:none}
.when .a{font-size:26px;font-weight:700;color:var(--forest)}
.when .b{font-size:22px;color:var(--muted);margin-top:4px}
.row.speaking{background:linear-gradient(90deg,rgba(238,217,138,.28),rgba(238,217,138,0) 70%);border-radius:28px 28px 0 0}
</style></head><body>
<div class="stage">
  <div class="head">
    <div><div class="eyebrow">Advisor board</div><div class="title" style="margin-top:10px">Up <span class="accent">next</span></div></div>
    <div class="seg"><span class="on">Up next</span><span>By committee</span></div>
  </div>
  <div class="card list">
    <div class="row speaking">
      <div class="place now"><svg width="26" height="26" viewBox="0 0 24 24" fill="#1B3828"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0" fill="none" stroke="#1B3828" stroke-width="2.2" stroke-linecap="round"/><path d="M12 17v3" stroke="#1B3828" stroke-width="2.2" stroke-linecap="round"/></svg></div>
      <img class="flag" src="../../../public/flags/1x1/fr.svg" width="76" height="76">
      <div class="who"><div class="name">Amélie Laurent</div><div class="sub">France · <b>DISEC</b></div></div>
      <div class="when"><div class="a">Speaking now</div><div class="b tnum">0:48 left</div></div>
    </div>
    <div class="row">
      <div class="place tnum">2</div>
      <img class="flag" src="../../../public/flags/1x1/br.svg" width="76" height="76">
      <div class="who"><div class="name">Lucas Oliveira</div><div class="sub">Brazil · <b>UNHRC</b></div></div>
      <div class="when"><div class="a">Next</div><div class="b">about 1 min</div></div>
    </div>
    <div class="row">
      <div class="place tnum">4</div>
      <img class="flag" src="../../../public/flags/1x1/jp.svg" width="76" height="76">
      <div class="who"><div class="name">Hana Sato</div><div class="sub">Japan · <b>DISEC</b></div></div>
      <div class="when"><div class="a">2 speakers ahead</div><div class="b">about 3 min</div></div>
    </div>
    <div class="row">
      <div class="place tnum">6</div>
      <img class="flag" src="../../../public/flags/1x1/ke.svg" width="76" height="76">
      <div class="who"><div class="name">Daniel Mwangi</div><div class="sub">Kenya · <b>UNHRC</b></div></div>
      <div class="when"><div class="a">4 speakers ahead</div><div class="b">about 6 min</div></div>
    </div>
  </div>
</div>
</body></html>
