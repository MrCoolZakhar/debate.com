<!doctype html><html><head><meta charset="utf-8"><meta name="size" content="1120x680">
<link rel="stylesheet" href="_base.css">
<style>
.stage{height:680px;padding:60px 72px}
.title{font-size:54px;margin-top:12px}
.sub{font-size:26px;color:var(--inksoft);margin-top:14px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;margin-top:44px}
.t{padding:36px 36px 40px;position:relative}
.t .num{font-size:120px;font-weight:800;line-height:.9;color:var(--forest);letter-spacing:-.04em}
.t .lbl{font-size:22px;font-weight:600;color:var(--muted);margin-top:22px;text-transform:uppercase;letter-spacing:.06em}
.t .txt{font-size:31px;font-weight:600;line-height:1.3;color:var(--ink);margin-top:10px}
.t.pick{box-shadow:0 0 0 4px var(--gold),var(--shadow)}
.t.pick .num{color:var(--deepgold)}
.go{position:absolute;top:34px;right:34px;width:58px;height:58px;border-radius:50%;background:linear-gradient(90deg,#1B3828,#2A5A3C);display:grid;place-items:center;box-shadow:0 6px 16px rgba(27,56,40,.3)}
</style></head><body>
<div class="stage">
  <img class="mark" src="../../../public/gavel-mark.png" style="width:420px;right:-60px;top:-70px">
  <div class="eyebrow">DISEC · Setting the agenda</div>
  <div class="title">Which topic opens <span class="accent">debate?</span></div>
  <div class="sub">The chair picks one before roll call. Switch any time.</div>
  <div class="grid">
    <div class="card t pick">
      <div class="go"><svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#EED98A" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>
      <div class="num">1</div><div class="lbl">Topic 1</div>
      <div class="txt">Regulating lethal autonomous weapons systems</div>
    </div>
    <div class="card t">
      <div class="num">2</div><div class="lbl">Topic 2</div>
      <div class="txt">Preventing an arms race in outer space</div>
    </div>
  </div>
</div>
</body></html>
